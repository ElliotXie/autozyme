schema_version: 2
patch: scanpy
ecosystem: python
upstream_package: scanpy
autozyme_package: autozyme
last_reviewed: 2026-06-16

purpose: >
  Lightweight inventory for the Scanpy patch. This file is documentation only:
  runtime activation is controlled by src/autozyme/scanpy/__init__.py.

truth_source:
  registration: src/autozyme/scanpy/__init__.py
  package_data: pyproject.toml
  e2e_results:
    - lib_scblas/e2e/find_neighbors/out_scanpy_neighbors_shared_4tier.tsv
    - lib_scblas/e2e/find_neighbors/out_scanpy_neighbors_shared_4tier.md

policy:
  unsupported_calls: fall back to upstream Scanpy
  benchmark_claims: keep detailed speed and concordance results in benchmark outputs, not here
  release_scope: listed public targets are included in the Scanpy aggregate patch unless status says otherwise

source_files:
  - src/autozyme/scanpy/__init__.py
  - src/autozyme/scanpy/_normalize.py
  - src/autozyme/scanpy/_highly_variable.py
  - src/autozyme/scanpy/_scale.py
  - src/autozyme/scanpy/_pca.py
  - src/autozyme/scanpy/_neighbors.py
  - src/autozyme/scanpy/_umap.py
  - src/autozyme/scanpy/_leiden.py
  - src/autozyme/scanpy/_rank_genes.py
  - src/autozyme/scanpy/_prepare.py

targets:
  scanpy.preprocessing.normalize_total:
    status: active
    contract: gated CSR-compatible normalize_total path

  scanpy.preprocessing.log1p:
    status: active
    contract: gated sparse log1p path

  scanpy.preprocessing.scale:
    status: active
    contract: gated scale path

  scanpy.preprocessing.highly_variable_genes:
    status: active
    contract: gated flavor-specific HVG path

  scanpy.preprocessing.neighbors:
    status: active
    contract: supported UMAP/euclidean/PCA graph fast path; graph concordance contract, not exact sparse equality
    aliases:
      - scanpy.neighbors.neighbors
    evidence:
      - lib_scblas/e2e/find_neighbors/out_scanpy_neighbors_shared_4tier.tsv
      - lib_scblas/e2e/find_neighbors/out_scanpy_neighbors_shared_4tier.md

  scanpy.tools.pca:
    status: active
    contract: gated PCA path; embeddings close up to sign
    aliases:
      - scanpy.preprocessing.pca
      - scanpy.preprocessing._pca.pca

  scanpy.tools.umap:
    status: active
    contract: gated UMAP layout path; neighborhood structure contract, not coordinate identity
    aliases:
      - scanpy.tools._umap.umap

  scanpy.tools.leiden:
    status: active
    contract: gated graph clustering path
    aliases:
      - scanpy.tools._leiden.leiden

  scanpy.tools.rank_genes_groups:
    status: active
    contract: gated Wilcoxon marker path

utilities:
  autozyme.scanpy.zyme_prepare:
    status: active
    contract: explicit helper, not a monkey patch

retired_targets:
  scanpy.preprocessing.regress_out:
    status: retired
    reason: not registered by the Scanpy aggregate patch
