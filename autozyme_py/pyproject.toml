[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autozyme"
version = "0.3.0"
description = "Drop-in accelerators for scientific Python packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliot Xie", email = "xie227@wisc.edu" }]
keywords = ["scientific-computing", "single-cell", "performance", "monkey-patch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Empty by design: autozyme is a monkey-patch overlay, not a dependency hub.
# It accelerates whatever upstream packages you already have installed, so it
# must not force a heavy ML stack on every install. Version-fragile upstreams
# (a patch that binds one release's internal API) are opt-in extras below, each
# with an exact tested freeze in its patch SCOPE.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml"]
# cell2location patch binds 0.1.5's PyroModule class name + forward signature,
# both version-fragile. Pins the ecosystem packages the patch targets; torch /
# numpy resolve transitively (kept unpinned so the extra stays cross-platform).
# Exact validated freeze (incl. torch/numpy) is in
# src/autozyme/cell2location/SCOPE.md.
cell2location = [
    "cell2location==0.1.5",
    "scvi-tools==1.3.3",
    "pyro-ppl==1.9.1",
]
# The lifelines accelerator's Cox kernel needs numba, which lifelines itself
# does not pull in: `pip install autozyme[lifelines]` provisions it. Without
# numba the patch declines to activate (with an actionable message) rather
# than erroring -- see autozyme/lifelines runtime_deps.
lifelines = ["numba"]
# sccoda 0.1.9 binds a TensorFlow/TFP HMC kernel and is fragile to its own
# transitive stack: arviz 1.x dropped `arviz.data` (which sccoda 0.1.9 imports),
# and the patch runs TF's legacy-Keras path (TF_USE_LEGACY_KERAS=1), so tf-keras
# must be present. This extra provisions the import-validated freeze.
# Platform caveat: the HMC sampler is validated on Linux. On macOS arm64 the
# TensorFlow/XLA HMC step can hang; prefer Linux or a conda-forge TensorFlow
# build there. See src/autozyme/sccoda/SCOPE.md for the full scope.
sccoda = [
    "sccoda==0.1.9",
    "arviz==0.23.4",
    "tf-keras",
    "tensorflow-probability",
]

[project.urls]
Homepage = "https://autozyme.com"
Repository = "https://github.com/ElliotXie/autozyme"
Issues = "https://github.com/ElliotXie/autozyme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle only finalized per-patch speedup snapshots so
# `autozyme.speedups("name")` works after a plain pip install (no dev tree
# access). Raw speedups.tsv histories stay in the framework repo and are not
# published.
#
# Subpackages enumerated explicitly because setuptools >= 77 rejects bare
# `"*"` as a key (despite its own schema claiming the predefined value is
# allowed — see setuptools/_distutils issue). Keep in sync with the per-
# patch dirs under src/autozyme/. New patch added? Append it here.
autozyme = ["scanpy_*/speedups_finalized.tsv"]
"autozyme.astropy_boxleastsquares" = ["speedups_finalized.tsv"]
"autozyme.cell2location"          = ["speedups_finalized.tsv"]
"autozyme.cellphonedb"            = ["speedups_finalized.tsv"]
"autozyme.dipy"                   = ["speedups_finalized.tsv"]
"autozyme.fipy"                   = ["speedups_finalized.tsv"]
"autozyme.lifelines"              = ["speedups_finalized.tsv"]
"autozyme.mdanalysis_rmsd"        = ["speedups_finalized.tsv"]
"autozyme.obspy"                  = ["speedups_finalized.tsv"]
"autozyme.prody"                  = ["speedups_finalized.tsv"]
"autozyme.sarsen"                 = ["speedups_finalized.tsv"]
"autozyme.sccoda"                 = ["speedups_finalized.tsv"]
"autozyme.scvelo"                 = ["speedups_finalized.tsv"]
"autozyme.squidpy_cooccurrence"   = ["speedups_finalized.tsv"]
"autozyme.statsmodels"            = ["speedups_finalized.tsv"]
"autozyme.xclim"                  = ["speedups_finalized.tsv"]
"autozyme.scanpy"                 = ["manifest.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
