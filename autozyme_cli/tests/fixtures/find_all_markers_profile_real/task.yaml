task: find_all_markers_profile_real
target_repo: https://github.com/satijalab/seurat
target_function: Seurat::FindAllMarkers
signature: Seurat::FindAllMarkers(object = obj, verbose = FALSE)

# Profile-only fixture built from the real workspace task. The dataset paths
# below are placeholders: point them at a local copy of the find_all_markers
# task data (the .rds files are not shipped). All profiler artifacts are
# written under this fixture's pipeline/ directory so benchmark/profiling
# experiments do not pollute the source task repository.
datasets:
  - {tier: tiny,   name: pbmc68k_30k,            path: <WORKSPACE>/find_all_markers/data/pbmc68k_30k.rds}
  - {tier: medium, name: pbmc68k_full,           path: <WORKSPACE>/find_all_markers/data/pbmc68k_full.rds}
  - {tier: large,  name: pbmc200k_glaucoma_120k, path: <WORKSPACE>/find_all_markers/data/pbmc200k_glaucoma_120k.rds}

metrics:
  - {name: neglog10_p_spearman,       threshold: 0.999,    comparator: gte}
  - {name: avg_log2fc_q99_abs_diff,   threshold: 0.000001, comparator: lte}
  - {name: top50_marker_jaccard,      threshold: 0.95,     comparator: gte}

