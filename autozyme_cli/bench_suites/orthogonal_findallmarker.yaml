id: orthogonal_findallmarker
stage: iterate
prompt_slot: iterate
field: Bio
description: |
  PromptLab experiment 2026-05-12 — three orthogonal-angle injections on
  findallmarker, all running the same baseline iterate prompt. The discriminator
  is the INJECT.md file copied into each task post-scaffold.
    A = algorithmic_only (math drift, [algorithmic] commits only)
    B = native_kernel    (Rcpp/sourceCpp rewrites, [conservative] only)
    C = orchestration    (parallel/layout/cache, [conservative] only)
  Inject files live at PromptLab/experiments/2026-05-12_orthogonal_findallmarker/.
default_reps: 1
default_budget_rounds: 50

tasks:
  - id: findallmarker_A_algorithmic
    template: findallmarker
    probe: algorithmic_only
  - id: findallmarker_B_native
    template: findallmarker
    probe: native_kernel
  - id: findallmarker_C_orchestration
    template: findallmarker
    probe: orchestration
