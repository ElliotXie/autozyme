schema_version: 2
patch: seurat
ecosystem: r
upstream_package: Seurat
autozyme_package: autozyme
last_reviewed: 2026-06-16

purpose: >
  Lightweight inventory for the Seurat patch. This file is documentation only:
  runtime activation is controlled by inst/patches/seurat/patch.R.

truth_source:
  registration: inst/patches/seurat/patch.R
  changelog: inst/patches/seurat/CHANGELOG.md
  contract_tests:
    - tests/testthat/test-seurat-parameter-policy.R
    - tests/testthat/test-contract-FindNeighbors.R

policy:
  unsupported_calls: fall back to upstream Seurat
  benchmark_claims: keep detailed speed and concordance results in benchmark outputs, not here
  release_scope: listed targets are included in the Seurat aggregate patch unless status says otherwise

source_files:
  - inst/patches/seurat/patch.R
  - src/seurat_normalize.cpp
  - src/seurat_variable_features.cpp
  - src/seurat_scale.cpp
  - src/seurat_neighbors.cpp
  - src/seurat_runumap.cpp
  - src/seurat_markers.cpp
  - src/seurat_sctransform.cpp

targets:
  NormalizeData.Seurat:
    status: active
    contract: gated LogNormalize fast path; unsupported arguments fall back

  FindVariableFeatures.Seurat:
    status: active
    contract: gated VST fast path

  FindVariableFeatures.StdAssay:
    status: active
    contract: gated VST fast path

  VST.dgCMatrix:
    status: active
    contract: numerical HVG overlap contract, not bitwise identity

  ScaleData.Seurat:
    status: active
    contract: gated default scale/center path

  FindNeighbors.Seurat:
    status: active
    contract: exact float32 Euclidean kNN on the supported PCA/dims path; not bitwise-identical to Seurat Annoy
    evidence:
      - tests/testthat/test-contract-FindNeighbors.R
      - lib_scblas/e2e/find_neighbors/out_seurat_findneighbors_shared_full_thread_sweep.tsv

  FindAllMarkers:
    status: active
    contract: gated Wilcoxon marker path

  FindMarkers.Seurat:
    status: active
    contract: gated Wilcoxon marker path

  RunPCA.StdAssay:
    status: active
    contract: gated PCA path; embeddings/loadings close up to sign

  RunPCA.default:
    status: active
    contract: gated PCA path; embeddings/loadings close up to sign

  RunCCA.default:
    status: active
    contract: gated numerical CCA path

  RunCCA.Seurat:
    status: active
    contract: gated Seurat CCA path

  FindIntegrationAnchors:
    status: active
    contract: gated CCA integration path

  FindWeights:
    status: active
    contract: upstream-compatible integration weights path

  CCAIntegration:
    status: active
    contract: gated CCAIntegration path

  SCTransform.Seurat:
    status: active
    contract: gated default v2 SCT path

  SCTransform.default:
    status: active
    contract: gated default v2 SCT path

  RunUMAP.Seurat:
    status: active_when_uwot_available
    contract: registered by the Seurat aggregate patch when uwot is installed; unsupported parameters fall back
    evidence:
      - tests/testthat/test-seurat-parameter-policy.R

retired_targets:
  RunUMAP.default:
    status: retired
    reason: not registered by the Seurat aggregate patch
